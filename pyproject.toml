[project]
name = "araxys"
version = "0.4.0"
description = "Plug & play security library for FastAPI — CORS, CSRF, IP blocking, rate limiting, honeypots, JWT (RS256/ES256), API keys, brute force, sessions, OTEL, Prometheus metrics, encrypted audit logging with async I/O, CSP headers, sanitization (NoSQL/command/path-traversal), and more."
readme = "README.md"
authors = [
    { name = "Samuel Esteban Urrego Valencia", email = "urregodev@gmail.com" },
]
requires-python = ">=3.13"
license = { text = "MIT" }
keywords = ["fastapi", "security", "rate-limiting", "jwt", "rs256", "es256", "jwks", "middleware", "honeypot", "csp", "csrf", "audit-logging", "nosql-injection", "sanitization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Typing :: Typed",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyjwt[crypto]>=2.8",
    "bleach>=6.0",
    "cryptography>=44.0",
    "structlog>=24.0",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]
opentelemetry = ["opentelemetry-api>=1.20", "opentelemetry-sdk>=1.20"]
prometheus = ["prometheus-client>=0.18"]
webhooks = ["httpx>=0.27"]
audit = ["aiofiles>=24.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "fakeredis>=2.21",
    "ruff>=0.11",
    "mypy>=1.10",
    "pre-commit>=4.0",
    "uvicorn>=0.30",
]
vault = ["hvac>=2.0"]
aws_secrets = ["boto3>=1.34"]
all = ["araxys[redis,opentelemetry,prometheus,webhooks,audit,vault,aws_secrets]"]

[project.scripts]
araxys = "araxys.cli:app"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
strict = true

[[tool.mypy.overrides]]
module = ["boto3", "hvac"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "types-aiofiles>=25.1.0.20260508",
]

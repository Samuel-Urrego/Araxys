[project]
name = "araxys"
version = "0.10.1"
description = "Plug & play security for FastAPI — CORS (glob), CSRF, IP blocking (trusted proxies), rate limiting (fixed+sliding), honeypots (URL+passive), JWT (RS256/ES256, token binding, leeway), API keys (sk_/pk_), MFA (TOTP), OAuth2/OIDC (PKCE), RBAC (resource:action), brute force (TTL), sessions, OTEL, Prometheus, encrypted audit (hash-chain), CSP, sanitization (JSON+form+multipart), DB security (Redis+PG pool, TLS, secrets), SQL parser"
readme = "README.md"
authors = [
    { name = "Samuel Esteban Urrego Valencia", email = "urregodev@gmail.com" },
]
requires-python = ">=3.13"
license = { text = "MIT" }
keywords = ["fastapi", "security", "rate-limiting", "jwt", "rs256", "es256", "jwks", "token-binding", "middleware", "honeypot", "csp", "csrf", "audit-logging", "nosql-injection", "sanitization", "sql-injection", "sqlparse", "connection-pooling", "permissions-policy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Typing :: Typed",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyjwt[crypto]>=2.8",
    "bleach>=6.0",
    "cryptography>=44.0",
    "structlog>=24.0",
    "typer>=0.12",
    "rich>=13.0",
    "sqlparse>=0.5.0",
    "pillow>=10",
    "pypdf>=4",
    "python-docx>=1",
    "openpyxl>=3",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]
opentelemetry = ["opentelemetry-api>=1.20", "opentelemetry-sdk>=1.20"]
prometheus = ["prometheus-client>=0.18"]
webhooks = ["httpx>=0.27"]
audit = ["aiofiles>=24.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "fakeredis>=2.21",
    "ruff>=0.11",
    "mypy>=1.10",
    "pre-commit>=4.0",
    "uvicorn>=0.30",
]
vault = ["hvac>=2.0"]
aws_secrets = ["boto3>=1.34"]
webauthn = ["cbor2>=5.0"]
prompt-guard-image = ["Pillow>=10"]
prompt-guard-pdf = ["pypdf>=4"]
prompt-guard-office = ["python-docx>=1", "openpyxl>=3"]
all = ["araxys[redis,opentelemetry,prometheus,webhooks,audit,vault,aws_secrets,webauthn,prompt-guard-image,prompt-guard-pdf,prompt-guard-office]"]

[project.scripts]
araxys = "araxys.cli:app"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B008"]
"src/araxys/sanitize/sqlparser.py" = ["I001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
strict = true

[[tool.mypy.overrides]]
module = ["boto3", "hvac", "sqlparse", "asyncpg", "redis", "openpyxl", "docx", "pypdf", "PIL"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "asyncpg>=0.31.0",
    "pytest-cov>=7.1.0",
    "python-multipart>=0.0.29",
    "types-aiofiles>=25.1.0.20260508",
]
